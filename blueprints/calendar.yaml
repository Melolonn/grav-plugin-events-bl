title: Calendrier
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      fields:

        calendar:
          type: tab
          title: Calendrier
          fields:
            header.content.items.@taxonomy.type:
              type: text
              label: Type de taxonomie
              default: event
            header.content.items.@taxonomy.event_repeat:
              type: text
              label: Se répète le
              placeholder: "[M,T,W,R,F,S,U]"
            header.content.items.@taxonomy.event_freq:
              type: select
              label: Fréquence
              help: À quelle fréquence cet événement doit-il se répéter ?
              default: none
              options:
                'none': PLUGIN_EVENTS.EVENTS.FREQ_NONE
                'daily': PLUGIN_EVENTS.EVENTS.FREQ_DAILY
                'weekly': PLUGIN_EVENTS.EVENTS.FREQ_WEEKLY
                'monthly': PLUGIN_EVENTS.EVENTS.FREQ_MONTHLY
                'yearly': PLUGIN_EVENTS.EVENTS.FREQ_YEARLY
            header.content.dateRange.start:
              type: date
              label: Date de début
            header.content.dateRange.end:
              type: date
              label: Date de fin
            header.content.order.by:
              type: text
              label: Trier par
              default: date
            header.content.order.dir:
              type: text
              label: Sens du tri
              default: asc
            header.content.limit:
              type: text
              label: Limite
              default: 0
            header.content.pagination:
              label: Pagination
              type: toggle
              highlight: 1
              default: 0
              options:
                1: Activé
                0: Désactivé
              validate:
                type: bool
