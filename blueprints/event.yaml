title: Événement
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      fields:

        event:
          type: tab
          title: Événement
          fields:
            header.event.status-section:
              type: section
              title: Statut
              underline: true
            header.event.status:
              label: Statut
              type: select
              default: ""
              options:
                "": "Aucun"
                "scheduled": "planifié"
                "postponed": "reporté"
                "cancelled": "annulé"
              title: Statut
              help: Les valeurs possibles sont planifié, reporté, annulé.
            header.event.dt-section:
              type: section
              title: Date et heure
              underline: true
            header.event.doors_open:
              type: datetime
              label: PLUGIN_EVENTS.EVENTS.DOORS_OPEN
              help: Utilisez le sélecteur de date pour saisir la date et l'heure d'ouverture des portes de cet événement.
            header.event.start:
              type: datetime
              label: Début
              help: Utilisez le sélecteur de date pour saisir la date et l'heure de début de cet événement.
              validate:
                type: required
            header.event.end:
              type: datetime
              label: Fin
              help: Utilisez le sélecteur de date pour saisir la date et l'heure de fin de cet événement.
              validate:
                type: required
            header.event.repeat:
              type: text
              label: Répétition
              help: Utilisez MTWRFSU pour indiquer les jours de la semaine où l'événement se répète. Par exemple, MWF.
              placeholder: MTWRFSU
            header.event.freq:
              type: select
              label: Fréquence
              help: À quelle fréquence cet événement doit-il se répéter ?
              default: none
              options:
                'none': PLUGIN_EVENTS.EVENTS.FREQ_NONE
                'daily': PLUGIN_EVENTS.EVENTS.FREQ_DAILY
                'weekly': PLUGIN_EVENTS.EVENTS.FREQ_WEEKLY
                'monthly': PLUGIN_EVENTS.EVENTS.FREQ_MONTHLY
                'yearly': PLUGIN_EVENTS.EVENTS.FREQ_YEARLY
            header.event.until:
              type: datetime
              label: Jusqu'au
              help: Pendant combien de temps cet événement doit-il se répéter ? (3 mois automatiquement si Répétition ou Fréquence est défini)
            header.event.author-section:
              type: section
              title: Auteurs et organisateurs
              underline: true
            header.event.authors:
              type: array
              label: Saisissez le nom de l'auteur ou la catégorie de l'événement à afficher en sous-titre.
              required: true
              value_only: true
            header.event.organizers:
              type: array
              label: Organisateurs
              placeholder_key: Nom
              placeholder_value: URL
              required: true
            header.event.topic:
              type: array
              label: Thème
              required: true
              value_only: true
            header.event.exceptions-section:
              type: section
              title: Exceptions
              underline: true
            header.event.exceptions:
              type: list
              style: vertical
              name: exceptions
              label: Saisissez les dates auxquelles cet événement récurrent n'aura pas lieu.
              fields:
                .date:
                  type: date
                  label: Date
            header.event.ticket-section:
              type: section
              underline: true
              title: Billetterie
            header.event.ticket_show:
              label: Affichage
              type: select
              options:
                "hidden": "Masqué"
                "free": "Gratuit"
                "price": "Payant"
              title: Afficher l'événement comme gratuit, payant ou sans information
            header.event.ticket_price:
              type: text
              label: Tarif
              placeholder: "9.00 $"
            header.event.ticket_link:
              type: text
              label: Lien de billetterie
              help: Collez ici le lien vers la billetterie
            header.event.location-section:
              type: section
              title: Lieu
              underline: true
            header.event.location:
              type: text
              label: Lieu
              help: Où se déroule cet événement ? Si vous saisissez une adresse, elle sera géocodée ci-dessous.
            header.event.coordinates:
              type: text
              label: Coordonnées
              placeholder: Latitude, Longitude
              help: Générées automatiquement à partir du champ Lieu.
            header.event.city:
              type: hidden
            header.event.zip:
              type: hidden
            header.event.country:
              type: hidden
