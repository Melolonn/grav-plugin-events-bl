name: Events
version: 1.2.0
description: "Le plugin **Events** permet de gérer et d'afficher des événements sur un site Grav grâce aux métadonnées (frontmatter)."
icon: calendar
author:
  name: Michael
  email: pikim@web.de
  url:
homepage: https://github.com/pikim/grav-plugin-events
demo:
keywords: events, calendar, ics, plugin
bugs: https://github.com/pikim/grav-plugin-events/issues
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - datetools
  - translate-date

compatibility:
  grav:
    - '2.0'

form:
  validation: loose
  fields:
    tabs:
      type: tabs
      active: 1

      fields:
        setup:
          type: tab
          title: Traitement
          fields:

#            processing_section:
#              type: section
#              title: Processing
#              underline: true
#            event_template_types:
#              type: text
#              label: Event Template Types
#              help: What templates should be checked for event related content?
#              default: event
#            display_months_out:
#              type: text
#              label: Months Out to Display Events
#              help: In integer form, how many months out should repeating dates display?
#              default: 3
#              placeholder: 3
#            enable_single_event_filter:
#              type: toggle
#              label: Enable Single Event Filter
#              highlight: 1
#              default: 1
#              options:
#                1: Enabled
#                0: Disabled
#              validate:
#                type: bool
#
#            collections_section:
#              type: section
#              title: Collections
#              underline: true
#            filter_combinator:
#              type: text
#              label: Filter Combinator
#              default: and
#            events_collection:
#              type: text
#              label: Events Collection
#              default: "'@page': '/events'"
#
            events_section:
              type: section
              title: Événements
              underline: true
            events_subpage:
              type: text
              label: Sous-page des événements
              help: Sous-page sous laquelle la liste des événements est disponible.
              default: "/events"

            icalendar_section:
              type: section
              title: Calendriers iCalendar
              underline: true
            icalendar_folder:
              type: text
              label: Dossier virtuel pour les événements iCalendar (NE PAS UTILISER POUR SON PROPRE CONTENU !)
              help: Dossier où les événements sont enregistrés. Il sera supprimé (en partie) et recréé lors de la mise à jour des événements.
              default: "/ical"
            icalendar_update:
              type: toggle
              label: Mettre à jour le dossier virtuel. Sera automatiquement réinitialisé après l'enregistrement.
              help: "« Tout » met à jour tous les événements. « Nouveau » crée les événements qui n'existent pas encore. « Aucun » enregistre uniquement les paramètres d'administration."
              highlight: 1
              default: 0
              options:
                2: Tout
                1: Nouveau
                0: Aucun
              validate:
                type: int
            icalendars:
              type: editor
              label: Fichiers iCalendar
              help: Les fichiers qui seront analysés pour la création d'événements. Un seul fichier par ligne.
              codemirror:
                mode: "text/plain"
                indentUnit: 0
                lineNumbers: true
                styleActiveLine: true
              default: ""
            icalendar_recurrence:
              type: toggle
              label: Gestion des récurrences
              help: "« fichier » crée un dossier/fichier d'événement dédié pour chaque occurrence d'un événement récurrent (sur le disque). « virtuel » crée un seul dossier/fichier d'événement et génère les occurrences virtuellement (en mémoire vive)."
              highlight: 0
              default: 0
              options:
                0: fichier
                1: virtuel
              validate:
                type: bool

            misc_section:
              type: section
              title: Divers
              underline: true
            enable_geocoding:
              type: toggle
              label: Activer le géocodage des adresses
              highlight: 1
              default: 0
              options:
                1: Activé
                0: Désactivé
              validate:
                type: bool
            api_key:
              type: text
              label: Clé API Google Maps
              help: Clé API pour la traduction d'adresse. Recherchez « maps api key » sur Google pour savoir comment en obtenir une.
              default: none

        formatting:
          type: tab
          title: Formatage des dates
          fields:

            calendar:
              type: section
              title: Calendrier
              underline: true
            calendar.first_dow:
              type: radio
              label: Premier jour de la semaine
              default: 0
              options:
                5: Samedi
                6: Dimanche
                0: Lundi
            calendar.day_char:
              type: number
              label: Longueur du nom du jour
              help: Afficher uniquement les n premiers caractères du nom du jour (0 pour afficher le nom complet).
              default: 0
              validate:
                min: 0
                max: 20
            calendar.month_char:
              type: number
              label: Longueur du nom du mois
              help: Afficher uniquement les n premiers caractères du nom du mois (0 pour afficher le nom complet).
              default: 0
              validate:
                min: 0
                max: 20
            calendar.header:
              type: text
              label: En-tête
              default: F Y
            calendar.anchor_title:
              type: text
              label: Titre de l'ancre
              default: l, F j, Y
            calendar.details.title:
              type: text
              label: Titre du jour dans les détails
              default: l, F j
            calendar.details.time:
              type: text
              label: Heure de la journée dans les détails
              default: g:ia

            event_item:
              type: section
              title: Élément d'événement
              underline: true
            event_item.date:
              type: text
              label: Date de l'événement
              default: l, F j, Y
            event_item.day:
              type: text
              label: Jour dans le bloc date des événements
              default: d
            event_item.month:
              type: text
              label: Mois dans le bloc date des événements
              default: M
            event_item.time:
              type: text
              label: Heure dans le bloc date des événements
              default: g:ia

            event_meta:
              type: section
              title: Métadonnées d'événement
              underline: true
            event_meta.until:
              type: text
              label: Jusqu'au
              default: F j, Y
            event_meta.display_location:
              type: toggle
              label: Afficher le lieu de l'événement
              highlight: 1
              default: 0
              options:
                1: Activé
                0: Désactivé
              validate:
                type: bool

            event_sidebar:
              type: section
              title: Barre latérale d'événements
              underline: true
            event_sidebar.enable_categories:
              type: toggle
              label: Activer les catégories d'événements
              highlight: 1
              default: 0
              options:
                1: Activé
                0: Désactivé
              validate:
                type: bool
            event_sidebar.header:
              type: text
              label: En-tête
              default: l, F j
            event_sidebar.time:
              type: text
              label: Heure
              default: g:ia
